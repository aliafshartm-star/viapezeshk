name: Generate Keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias viapezeshk -storepass ViaPezeshk1404 -keypass ViaPezeshk1404 -dname "CN=Ali, OU=ViaPezeshk, O=ViaPezeshk, L=Tehran, S=Tehran, C=IR"

      - name: Create Base64 Text File
        run: |
          base64 -w 0 keystore.jks > keystore_base64.txt

      - name: Commit and Push File
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add keystore_base64.txt
          git commit -m "Add keystore_base64.txt for copy"
          git push