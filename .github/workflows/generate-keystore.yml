name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias viapezeshk -storepass ViaPezeshk1404 -keypass ViaPezeshk1404 -dname "CN=Ali, OU=ViaPezeshk, O=ViaPezeshk, L=Tehran, S=Tehran, C=IR"
      
      - name: Convert to Base64
        run: |
          base64 keystore.jks > keystore_base64.txt
          
      - name: Upload Keystore Files
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            keystore.jks
            keystore_base64.txt