name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias viapezeshk -storepass ViaPezeshk1404 -keypass ViaPezeshk1404 -dname "CN=Ali, OU=ViaPezeshk, O=ViaPezeshk, L=Tehran, S=Tehran, C=IR"

      - name: Show Keystore in Summary
        run: |
          echo "### 🔑 متن کی‌استور (Keystore Base64)" >> $GITHUB_STEP_SUMMARY
          echo "👇 روی آیکون کپی که بالای کادر سمت راست هست بزنید:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          base64 -w 0 keystore.jks >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY