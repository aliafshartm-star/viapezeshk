name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias viapezeshk -storepass ViaPezeshk1404 -keypass ViaPezeshk1404 -dname "CN=Ali, OU=ViaPezeshk, O=ViaPezeshk, L=Tehran, S=Tehran, C=IR"
      
      - name: Print Keystore Base64
        run: |
          echo "======= شروع کپی کردن از اینجا ======="
          base64 -w 0 keystore.jks
          echo ""
          echo "======= پایان کپی کردن تا اینجا ======="